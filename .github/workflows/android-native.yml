name: Android native

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Gradle
        working-directory: android-app
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:assembleRelease :baselineprofile:assemble :macrobenchmark:assembleBenchmark

  baseline-profile:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Emulator i Baseline Profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            cd android-app
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:assembleNonMinifiedRelease :baselineprofile:assembleNonMinifiedRelease
            adb install -r app/build/outputs/apk/nonMinifiedRelease/app-nonMinifiedRelease.apk
            adb install -r baselineprofile/build/outputs/apk/nonMinifiedRelease/baselineprofile-nonMinifiedRelease.apk
            adb shell am instrument -w -r \
              -e class io.github.mlsivanovic.mozgalica.baselineprofile.BaselineProfileGenerator#generisi \
              io.github.mlsivanovic.mozgalica.baselineprofile/androidx.test.runner.AndroidJUnitRunner
            adb pull \
              "/storage/emulated/0/Android/media/io.github.mlsivanovic.mozgalica.baselineprofile/BaselineProfileGenerator_generisi-baseline-prof.txt" \
              app/src/main/baseline-prof.txt
      - name: Sačuvaj profil
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: |
            android-app/app/src/main/baseline-prof.txt
            android-app/app/build/outputs/baselineProfiles/
          if-no-files-found: warn

  macrobenchmark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Emulator i merenja
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            cd android-app
            chmod +x ./gradlew
            ./gradlew --no-daemon :macrobenchmark:connectedBenchmarkAndroidTest
      - name: Sačuvaj izveštaje
        uses: actions/upload-artifact@v4
        with:
          name: macrobenchmark
          path: |
            android-app/macrobenchmark/build/outputs/androidTest-results/
            android-app/macrobenchmark/build/reports/
          if-no-files-found: warn
