<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Postavlja temu PRE prvog crtanja stranice (sprečava bljesak pogrešne teme).
      // Držano u sinhronizaciji sa src/lib/tema.ts (isti ključ, ista pravila).
      (function () {
        try {
          var t = localStorage.getItem('mozgalica:tema');
          if (t !== 'svetla' && t !== 'tamna') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'tamna' : 'svetla';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <script>
      // Dečji profil dobija zaseban PWA identitet, bez upisivanja tajnog tokena u manifest.
      (function () {
        var decjaRuta = window.location.hash.indexOf('#/dete/') === 0;
        var manifest = document.createElement('link');
        manifest.id = 'mozgalica-manifest';
        manifest.rel = 'manifest';
        manifest.href = '%BASE_URL%' + (decjaRuta ? 'manifest-dete.webmanifest' : 'manifest.webmanifest');
        document.head.appendChild(manifest);
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mozgalica" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b6ee1" />
    <meta name="description" content="Kvizovi iz matematike, srpskog i šaha - za decu 3. i 4. razred" />
    <meta property="og:title" content="Mozgalica — kvizovi i šah" />
    <meta property="og:description" content="Kvizovi iz matematike, srpskog i šaha - za decu 3. i 4. razred" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mozgalica — kvizovi i šah" />
    <meta name="twitter:description" content="Kvizovi iz matematike, srpskog i šaha - za decu 3. i 4. razred" />
    <title>Mozgalica — kvizovi i šah</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
