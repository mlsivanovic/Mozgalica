<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('mozgalica:tema');
          if (t !== 'svetla' && t !== 'tamna') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'tamna' : 'svetla';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Stranica nije pronađena — Mozgalica</title>
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
    <link rel="stylesheet" href="/stil.css" />
  </head>
  <body>
    <main class="sekcija">
      <div class="okvir okvir--uzak" style="text-align: center">
        <svg width="88" height="88" viewBox="0 0 84 84" aria-hidden="true" style="margin-bottom: 12px">
          <circle cx="42" cy="38" r="28" fill="#fbbf24"/>
          <path d="M31 61h22v5a8 8 0 0 1-8 8h-6a8 8 0 0 1-8-8Z" fill="#4f46e5"/>
          <circle cx="33" cy="40" r="2.7" fill="#25225a"/>
          <circle cx="51" cy="40" r="2.7" fill="#25225a"/>
          <path d="M34 49q8 6 16 0" fill="none" stroke="#25225a" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <br />
        <p class="nadnaslov">Greška 404</p>
        <h1>Ova stranica ne postoji</h1>
        <p class="uvod" style="margin-inline: auto">Možda je link skraćen ili zastareo.</p>
        <div class="heroj__dugmad" style="justify-content: center">
          <a class="dugme" href="/">Na početnu</a>
          <a class="dugme dugme--obrubljeno" href="/app/#/prijava">Prijava za roditelje</a>
        </div>
      </div>
    </main>
  </body>
</html>
